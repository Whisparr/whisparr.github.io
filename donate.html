<!DOCTYPE html>
<html>

<head>
   <title>Whisparr - Donate</title>
   <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
   <link rel="stylesheet" type="text/css"
      href="//maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
   <link rel="stylesheet" type="text/css" href="css/donate.css" />
   <link href='//fonts.googleapis.com/css?family=Lato:300' rel='stylesheet' type='text/css' />
   <link rel="icon" type="image/ico" href="img/favicon.ico" />
</head>

<body class="pull_top" data-spy="scroll" data-target=".header-navbar" data-offset="70">
   <div class="container">
      <div class="row">
         <div id="donate" class="donate col-lg-6 offset-md-3">
            <div class="section-header">
               <img src="logo/128.png">
               <h1><i class="fa fa-heart"></i> Awww, We love you too!</h1>
               <span>Your donations will help support Whisparr, we promise to put it to good use.</span>
            </div>
            <div class="row">
               <div class="col-lg-8 offset-md-2">
                  <a href="https://opencollective.com/whisparr" target="_blank" rel="noopener noreferrer"
                     class="btn btn-lg btn-block donate-btn donate-option">
                     <i class="fa fa-heart"></i> Donate via Open Collective
                  </a>
               </div>
            </div>
         </div>
      </div>
   </div>
</body>
<script src="//ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script src="//cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

</html>
